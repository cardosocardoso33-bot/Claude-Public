<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Científica</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div id="expression" class="expression"></div>
      <div id="result" class="result">0</div>
    </div>

    <div class="mode-toggle">
      <button id="deg-rad-btn" class="mode-btn" onclick="toggleDegRad()">DEG</button>
      <button class="mode-btn" onclick="toggleInverse()">INV</button>
    </div>

    <div class="buttons">
      <button class="btn fn" onclick="inputFn('sin(')">sin</button>
      <button class="btn fn" onclick="inputFn('cos(')">cos</button>
      <button class="btn fn" onclick="inputFn('tan(')">tan</button>
      <button class="btn fn" onclick="inputFn('log(')">log</button>
      <button class="btn fn" onclick="inputFn('ln(')">ln</button>

      <button class="btn fn" onclick="inputFn('asin(')">asin</button>
      <button class="btn fn" onclick="inputFn('acos(')">acos</button>
      <button class="btn fn" onclick="inputFn('atan(')">atan</button>
      <button class="btn fn" onclick="inputFn('log2(')">log₂</button>
      <button class="btn fn" onclick="inputFn('sqrt(')">√</button>

      <button class="btn fn" onclick="inputFn('π')">π</button>
      <button class="btn fn" onclick="inputFn('e')">e</button>
      <button class="btn fn" onclick="inputFn('^')">xʸ</button>
      <button class="btn fn" onclick="inputFn('!')">n!</button>
      <button class="btn fn" onclick="inputFn('abs(')">|x|</button>

      <button class="btn op" onclick="clearAll()">AC</button>
      <button class="btn op" onclick="deleteLast()">⌫</button>
      <button class="btn op" onclick="inputFn('%')">%</button>
      <button class="btn op" onclick="inputFn('/')">÷</button>
      <button class="btn op" onclick="inputFn('(')">(</button>

      <button class="btn num" onclick="inputNum('7')">7</button>
      <button class="btn num" onclick="inputNum('8')">8</button>
      <button class="btn num" onclick="inputNum('9')">9</button>
      <button class="btn op" onclick="inputFn('*')">×</button>
      <button class="btn op" onclick="inputFn(')')">) </button>

      <button class="btn num" onclick="inputNum('4')">4</button>
      <button class="btn num" onclick="inputNum('5')">5</button>
      <button class="btn num" onclick="inputNum('6')">6</button>
      <button class="btn op" onclick="inputFn('-')">−</button>
      <button class="btn fn" onclick="inputFn('1/')">1/x</button>

      <button class="btn num" onclick="inputNum('1')">1</button>
      <button class="btn num" onclick="inputNum('2')">2</button>
      <button class="btn num" onclick="inputNum('3')">3</button>
      <button class="btn op" onclick="inputFn('+')">+</button>
      <button class="btn fn" onclick="inputFn('x²')">x²</button>

      <button class="btn num zero" onclick="inputNum('0')">0</button>
      <button class="btn num" onclick="inputDot()">.</button>
      <button class="btn op" onclick="toggleSign()">±</button>
      <button class="btn eq" onclick="calculate()">=</button>
    </div>
  </div>

  <script src="calculator.js"></script>
</body>
</html>
